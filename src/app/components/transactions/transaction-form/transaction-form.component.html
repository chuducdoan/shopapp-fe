<div class="modal-overlay" (click)="close.emit()">
  <div class="modal-content card" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>{{ transaction ? 'Sửa giao dịch' : 'Thêm giao dịch' }}</h2>
      <button class="close-btn" (click)="close.emit()">×</button>
    </div>

    <form (ngSubmit)="onSubmit()" #form="ngForm">
      <div class="form-group type-toggle">
        <button type="button"
          [class.active]="formData.type === 'expense'"
          (click)="setType('expense')"
        class="toggle-btn expense">Chi</button>
        <button type="button"
          [class.active]="formData.type === 'income'"
          (click)="setType('income')"
        class="toggle-btn income">Thu</button>
      </div>

      <div class="form-group">
        <label class="form-label">Số tiền</label>
        <input type="number" class="form-control"
          [(ngModel)]="formData.amount" name="amount" required min="1">
      </div>

      <div class="form-group">
        <label class="form-label">Danh mục</label>
        <select class="form-control" [(ngModel)]="formData.categoryId" name="categoryId" required>
          <option value="" disabled selected>Chọn danh mục</option>
          @for (cat of availableCategories; track cat) {
            <option [value]="cat.id">
              {{cat.icon}} {{cat.name}}
            </option>
          }
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Ngày</label>
        <input type="date" class="form-control"
          [(ngModel)]="formData.date" name="date" required>
      </div>

      <div class="form-group">
        <label class="form-label">Ghi chú</label>
        <textarea class="form-control" rows="3"
        [(ngModel)]="formData.note" name="note"></textarea>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn" (click)="close.emit()">Hủy</button>
        <button type="submit" class="btn btn-primary" [disabled]="form.invalid">Lưu</button>
      </div>
    </form>
  </div>
</div>

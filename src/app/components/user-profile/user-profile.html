<div class="container">
    <div class="intro-section mb-5 mt-3">
        <h1>Thông tin User</h1>
    </div>
    <form [formGroup]="userProfileForm">
        <div class="row">
            <div class="col-md-3 mx-auto">
                <div class="mb1">
                    <label for="fullname" class="form-label">Họ và tên</label>
                    <input type="text" class="form-control" id="fullname" formControlName="fullname" 
                    [class.is-invalid]="userProfileForm.get('fullname')?.invalid && userProfileForm.get('fullname')?.touched">
                    <div class="invalid-feedback" *ngIf="userProfileForm.get('fullname')?.invalid && userProfileForm.get('fullname')?.touched">
                        Họ và tên là bắt buộc!
                    </div>
                </div>
                <div class="mb1">
                    <label for="phone_number" class="form-label">Số điện thoại</label>
                    <input type="text" class="form-control" id="phone_number" name="phone_number" formControlName="phone_number" [class.is-invalid]="userProfileForm.get('phone_number')?.invalid && userProfileForm.get('phone_number')?.touched">
                    <div class="invalid-feedback">
                        Vui lòng nhập số điện thoại hợp lệ!
                    </div>
                </div>
                <div class="mb1">
                    <label for="address" class="form-label">Địa chỉ</label>
                    <input type="text" class="form-control" id="address" name="address" formControlName="address" [class.is-invalid]="userProfileForm.get('address')?.invalid && userProfileForm.get('address')?.touched">
                    <div class="invalid-feedback">
                        Vui lòng nhập địa chỉ hợp lệ!
                    </div>
                </div>
                <div class="mb1">
                    <label for="password" class="form-label">Mật khẩu</label>
                    <input type="password" class="form-control" id="password" name="password" formControlName="password" [class.is-invalid]="userProfileForm.get('password')?.invalid && userProfileForm.get('password')?.touched">
                    <div class="invalid-feedback">
                        Vui lòng nhập mật khẩu hợp lệ!
                    </div>  
                </div>
                <div class="mb1">
                    <label for="retypePassword" class="form-label">Nhập lại mật khẩu</label>
                    <input type="password" class="form-control" id="retypePassword" name="retypePassword" formControlName="retypePassword" [class.is-invalid]="userProfileForm.get('retypePassword')?.invalid && userProfileForm.get('retypePassword')?.touched">
                    <div class="invalid-feedback">
                        Vui lòng nhập lại mật khẩu hợp lệ!
                    </div>  
                </div>
                <div class="mb1">
                    <label for="date_of_birth" class="form-label">Ngày sinh</label>
                    <input type="date" class="form-control" id="date_of_birth" name="date_of_birth" formControlName="date_of_birth" [class.is-invalid]="userProfileForm.get('date_of_birth')?.invalid && userProfileForm.get('date_of_birth')?.touched">
                    <div class="invalid-feedback">
                        Vui lòng nhập ngày sinh hợp lệ!
                    </div>  
                </div>
            </div>
        </div>
    </form>
</div>

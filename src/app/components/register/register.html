<div class="container">
    <div class="row">
        <div class="col-md-5 offset-md-3">
            <div class="login-form mx-auto">
                <h2 class="login-header">Đăng ký</h2>
                <div class="form-group mb-3">
                    <label for="username">Tên đăng nhập</label>
                    <input type="text" id="username" class="form-control" placeholder="Nhập tên đăng nhập">
                </div>
                <div class="form-group mb-3">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password" class="form-control" placeholder="Nhập mật khẩu">
                </div>
                 <div class="form-group mb-3">
                    <label for="confirm-password">Xác nhận mật khẩu</label>
                    <input type="password" id="confirm-password" class="form-control" placeholder="Nhập lại mật khẩu">
                </div>
                 <div class="form-group mb-3">
                    <label for="fullname">Họ và tên</label>
                    <input type="text" id="fullname" class="form-control" placeholder="Nhập họ và tên">
                </div>
                 <div class="form-group mb-3">
                    <label for="address">Địa chỉ</label>
                    <input type="text" id="address" class="form-control" placeholder="Nhập địa chỉ">
                </div>
                <div class="form-group mb-3">
                    <div class="form-check checkbox-text">
                        <span>
                            <input type="checkbox" class="form-check-input" id="remember">
                            <label class="form-check-label text-start" for="remember">Tôi đồng ý với điều khoản và điều kiện</label>
                        </span>
                    </div>
                </div>
                
                <button class="btn-gradient w-100 p-2 mb-4">Đăng ký</button>

                <div class="login-footer">
                    <p class="mt-3">Bạn đã có tài khoản? <a [routerLink]="['/login']" class="register-link">Đăng nhập</a></p>
                </div>
            </div>
        </div>
    </div>
</div>

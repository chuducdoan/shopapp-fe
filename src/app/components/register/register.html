<div class="container">
    <form #registerForm="ngForm">
        <div class="row">
            <div class="col-md-5 offset-md-3">
                <div class="login-form mx-auto">
                    <h2 class="login-header">Đăng ký</h2>
                    <div class="form-group mb-3">
                        <label for="phone">Phone</label>
                        <input type="text" id="phone" name="phone" class="form-control" placeholder="Nhập tên đăng nhập" [(ngModel)]="phone" required 
                            (focus)="registerForm?.form?.markAsTouched()">
                        <div class="divider-nospace"></div>
                        <p class="text-danger" *ngIf="phone.length < 6 && registerForm?.form?.touched">Số điện thoại phải có ít nhất 6 ký tự</p>
                    </div>
                    <div class="form-group mb-3">
                        <label for="password">Mật khẩu</label>
                        <input type="password" id="password" name="password" class="form-control" placeholder="Nhập mật khẩu" [(ngModel)]="password">
                        <div class="divider-nospace"></div>
                        <p class="text-danger" *ngIf="password.length < 3 && registerForm?.form?.touched">Mật khẩu phải có ít nhất 3 ký tự</p>
                    </div>
                    <div class="form-group mb-3">
                        <label for="confirm-password">Xác nhận mật khẩu</label>
                        <input type="password" id="confirm-password" name="confirmPassword" class="form-control" placeholder="Nhập lại mật khẩu" 
                        [(ngModel)]="confirmPassword" (input)="checkPasswordMatch()" required>
                        <div class="divider-nospace"></div>
                         <p class="text-danger" *ngIf="confirmPassword.length < 3 && registerForm?.form?.touched">Mật khẩu phải có ít nhất 3 ký tự</p>
                        <p class="text-danger" *ngIf="registerForm?.form?.controls?.['confirmPassword']?.errors?.['passwordMismatch']">Mật khẩu không khớp</p>
                    </div>
                    <div class="form-group mb-3">
                        <label for="fullname">Họ và tên</label>
                        <input type="text" id="fullname" name="fullname" class="form-control" placeholder="Nhập họ và tên" [(ngModel)]="fullname">
                    </div>
                    <div class="form-group mb-3">
                        <label for="address">Địa chỉ</label>
                        <input type="text" id="address" name="address" class="form-control" placeholder="Nhập địa chỉ" [(ngModel)]="address">
                    </div>
                    <div class="form-group mb-3">
                        <label for="date-of-birth">Ngày sinh</label>
                        <input type="date" id="date-of-birth" name="dateOfBirth" class="form-control" [(ngModel)]="dateOfBirth" required 
                            (input)="registerForm?.form?.markAsTouched(); checkAge()"
                        >
                        <div class="divider-nospace"></div>
                        <p class="text-danger" *ngIf="registerForm?.form?.controls?.['dateOfBirth']?.errors?.['ageNotValid']">Bạn phải đủ 18 tuổi</p>
                    </div>
                    <div class="form-group mb-3">
                        <div class="form-check checkbox-text">
                            <span>
                                <input type="checkbox" class="form-check-input" id="remember" name="isAccepted" [(ngModel)]="isAccepted">
                                <label class="form-check-label text-start" for="remember">Tôi đồng ý với điều khoản và điều kiện</label>
                            </span>
                        </div>
                    </div>
                    
                    <button type="button" class="btn-gradient w-100 p-2 mb-4" (click)="register()">Đăng ký</button>

                    <div class="login-footer">
                        <p class="mt-3">Bạn đã có tài khoản? <a [routerLink]="['/login']" class="register-link">Đăng nhập</a></p>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>

<div class="modal-overlay" (click)="close.emit()">
  <div class="modal-content card" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Thêm danh mục</h2>
      <button class="close-btn" (click)="close.emit()">×</button>
    </div>

    <form (ngSubmit)="onSubmit()" #form="ngForm">
      <div class="form-group">
        <label class="form-label">Tên danh mục</label>
        <input class="form-control" [(ngModel)]="formData.name" name="name" required min="1" />
      </div>

      <div class="form-group">
        <label class="form-label">Loại danh mục</label>
        <select class="form-control" [(ngModel)]="formData.type" name="type" required>
          <option value="" disabled selected>Chọn danh mục</option>
          <option value="income">Thu</option>
          <option value="expense">Chi</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Icon</label>
        <input type="text" class="form-control" [(ngModel)]="formData.icon" name="icon" required />
      </div>

      <div class="form-group">
        <label class="form-label">Màu sắc</label>
        <input
          type="color"
          class="form-control"
          [(ngModel)]="formData.color"
          name="color"
          required
        />
      </div>

      <div class="modal-actions">
        <button type="button" class="btn" (click)="close.emit()">Hủy</button>
        <button type="submit" class="btn btn-primary" [disabled]="form.invalid">Lưu</button>
      </div>
    </form>
  </div>
</div>

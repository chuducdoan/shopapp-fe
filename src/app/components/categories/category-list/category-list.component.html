<div class="categories-page">
  <div class="page-header flex justify-between items-center mb-4">
    <h1 class="page-title">Danh mục</h1>
    <!-- Nút thêm sẽ mở form tương tự như transaction -->
    <button class="btn btn-primary" (click)="addCategory()">+ Thêm danh mục</button>
  </div>

  <div class="categories-grid">
    @for (cat of expenseService.categories(); track cat) {
      <div
        class="card category-card"
        [style.border-top]="'4px solid ' + (cat.color || '#ccc')"
        >
        <div class="cat-icon" [style.color]="cat.color">{{ cat.icon }}</div>
        <div class="cat-info">
          <h3>{{ cat.name }}</h3>
          <span
            class="badge"
            [class.badge-success]="cat.type === 'income'"
            [class.badge-danger]="cat.type === 'expense'"
            >
            {{ cat.type === 'income' ? 'Thu' : 'Chi' }}
          </span>
        </div>
      </div>
    }
  </div>
</div>

@if (isShowModal) {
  <app-category-form (close)="closeModal()"></app-category-form>
}

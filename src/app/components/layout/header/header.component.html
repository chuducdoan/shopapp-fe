<header class="header">
  <nav class="navbar navbar-expand-lg navbar-light bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">Navbar</a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav mr-auto">
          <li class="nav-item" [ngClass]="{'active': activeNavItem === 0}">
            <a class="nav-link" [routerLink]="['/home']" (click)="handleItemClick(0)">Trang chủ</a>
          </li>
          <li class="nav-item" [ngClass]="{'active': activeNavItem === 1}">
            <a class="nav-link" [routerLink]="['/orders']" (click)="handleItemClick(1)">Thông báo</a>
          </li>
          <li class="nav-item" [ngClass]="{'active': activeNavItem === 2}">
            <a class="nav-link" [routerLink]="['/orders']" (click)="handleItemClick(2)">Giỏ hàng</a>
          </li>
          <li class="nav-item">
            
            <ng-container *ngIf="userResponse !== null">
              <a class="nav-link" 
                 [ngbPopover]="popoverContent"
                 popoverTitle="User Actions"
                 triggers="click"
                 [placement]="['bottom', 'top']">
                {{userResponse.full_name}}
              </a>
              <ng-template #popoverContent>
                <div class="popover-list">
                  <a class="popover-item" href="javascript:void(0)" (click)="handleItemClick(0)">Tài khoản của tôi</a>
                  <a class="popover-item" href="javascript:void(0)" (click)="handleItemClick(1)">Đơn mua</a>
                  <a class="popover-item" href="javascript:void(0)" (click)="handleItemClick(2)">Đăng xuất</a>
                </div>
              </ng-template>
            </ng-container>
            <ng-container *ngIf="!userResponse || userResponse === null">
              <a class="nav-link" [routerLink]="['/login']">Đăng nhập</a>
            </ng-container>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>

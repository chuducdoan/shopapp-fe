<div class="container">
    <form [formGroup]="formLogin">
        <div class="row">
            <div class="col-md-5 offset-md-3">
                <div class="login-form mx-auto">
                    <h2 class="login-header">Đăng nhập</h2>
                    <div class="form-group mb-3">
                        <label for="phone_number">Phone</label>
                        <input type="text" id="phone" class="form-control" placeholder="Nhập số điện thoại" 
                            required name="phone_number" formControlName="phone_number">
                        <div class="divider-nospace"></div>
                        <p class="text-danger" *ngIf="formLogin.get('phone_number')?.invalid && formLogin.get('phone_number')?.touched">Số điện thoại phải có ít nhất 6 ký tự</p>
                    </div>
                    <div class="form-group mb-3">
                        <label for="password">Mật khẩu</label>
                        <input type="password" id="password" class="form-control" placeholder="Nhập mật khẩu" 
                            required name="password" formControlName="password">
                        <div class="divider-nospace"></div>
                        <p class="text-danger" *ngIf="formLogin.get('password')?.invalid && formLogin.get('password')?.touched">Mật khẩu phải có ít nhất 3 ký tự</p>
                    </div>
                    <div class="form-group mb-3">
                        <div class="form-check checkbox-text">
                            <span>
                                <input type="checkbox" class="form-check-input" id="remember" name="rememberMe" formControlName="rememberMe">
                                <label class="form-check-label text-start" for="remember" >Ghi nhớ đăng nhập</label>
                            </span>
                            <a href="#" class="register-link">Quên mật khẩu</a>
                        </div>
                    </div>
                    
                    <button class="btn-gradient w-100 p-2 mb-4" (click)="login()" type="button">Đăng nhập</button>
    
                    <div class="login-footer">
                        <p class="mt-3">Bạn chưa có tài khoản? <a [routerLink]="['/register']" class="register-link">Tạo tài khoản</a></p>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
